name: Bug report
description: Something in DirectServe crashed, misbehaved or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Tap ...\n3. See ..."
  - type: input
    id: context
    attributes:
      label: Context
      description: The receiving device and browser (e.g. iPhone Safari, Windows Chrome, a smart TV) and the file type
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: "Pixel 8, Android 16"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DirectServe version
      description: Android Settings > Apps > DirectServe
      placeholder: "1.0.26"
    validations:
      required: true
